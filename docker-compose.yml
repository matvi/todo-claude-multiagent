# Local development helper: runs ONLY Postgres.
# The backend (dotnet run) and frontend (npm run dev) run on the host.
#   docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: tododb
    ports:
      - "5432:5432"
    volumes:
      - todo_pgdata:/var/lib/postgresql/data

volumes:
  todo_pgdata:

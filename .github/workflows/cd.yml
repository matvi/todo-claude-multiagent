# CD — deploy to Azure Container Apps on merge to `main` (specs §11.5).
# Auth: OIDC / workload identity federation via azure/login@v2 — NO stored
# client secret. Uses GitHub *variables* AZURE_CLIENT_ID / AZURE_TENANT_ID /
# AZURE_SUBSCRIPTION_ID (no credential material).
#
# Infra (Bicep) is intentionally NOT deployed here — it's provisioned once,
# manually, per infra/README.md, and only re-applied by hand when infra
# actually changes. This workflow only builds/pushes images and rolls the
# two already-existing Container Apps. It assumes rg-todo-demo, the ACR, and
# both apps already exist (see infra/README.md Phase 2).
#
# Honors the backend-before-frontend ordering constraint (specs §4.4 / §11.5):
# the frontend image bakes the backend FQDN at build time, so the backend is
# built + deployed FIRST, its FQDN read back, then the frontend is built with
# --build-arg VITE_API_BASE_URL=<backend FQDN>.

name: CD

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One deploy at a time; never let overlapping merges race a Container App revision.
concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  id-token: write   # required for OIDC federated login — no secret stored
  contents: read

env:
  RESOURCE_GROUP: rg-todo-demo

jobs:
  deploy:
    name: Build & deploy images to Azure Container Apps
    runs-on: ubuntu-latest
    # A GitHub Environment lets deployments show in history and lets a
    # required-reviewer rule be added later without editing this workflow.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC, no secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ------------------------------------------------------------------
      # 0. Look up the already-provisioned ACR (infra is deployed manually,
      #    once — see infra/README.md). Assumes exactly one ACR in the RG.
      # ------------------------------------------------------------------
      - name: Look up ACR
        id: infra
        run: |
          set -euo pipefail
          ACR_NAME=$(az acr list -g "$RESOURCE_GROUP" --query "[0].name" -o tsv)
          if [ -z "$ACR_NAME" ]; then
            echo "::error::No ACR found in $RESOURCE_GROUP. Run the one-time infra deploy first (infra/README.md)." >&2
            exit 1
          fi
          ACR_LOGIN_SERVER=$(az acr show -n "$ACR_NAME" -g "$RESOURCE_GROUP" --query loginServer -o tsv)
          echo "acr_name=$ACR_NAME" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$ACR_LOGIN_SERVER" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # 1. Backend FIRST — build + push, deploy, read back its FQDN.
      # ------------------------------------------------------------------
      - name: Build & push backend image (todo-api)
        run: |
          az acr build \
            --registry "${{ steps.infra.outputs.acr_name }}" \
            --image "todo-api:${{ github.sha }}" \
            --file backend/src/TodoApi/Dockerfile \
            ./backend

      - name: Update backend Container App
        id: api
        run: |
          set -euo pipefail
          az containerapp update -n todo-api -g "$RESOURCE_GROUP" \
            --image "${{ steps.infra.outputs.acr_login_server }}/todo-api:${{ github.sha }}"
          FQDN=$(az containerapp show -n todo-api -g "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # 2. Frontend SECOND — bake the backend FQDN at build time, then deploy.
      # ------------------------------------------------------------------
      - name: Build & push frontend image (todo-web) with backend FQDN baked
        run: |
          az acr build \
            --registry "${{ steps.infra.outputs.acr_name }}" \
            --image "todo-web:${{ github.sha }}" \
            --file frontend/Dockerfile \
            --build-arg VITE_API_BASE_URL="https://${{ steps.api.outputs.fqdn }}" \
            ./frontend

      - name: Update frontend Container App
        id: web
        run: |
          set -euo pipefail
          az containerapp update -n todo-web -g "$RESOURCE_GROUP" \
            --image "${{ steps.infra.outputs.acr_login_server }}/todo-web:${{ github.sha }}"
          FQDN=$(az containerapp show -n todo-web -g "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # 3. Reconcile CORS — ensure the backend allows the frontend origin.
      # ------------------------------------------------------------------
      - name: Reconcile backend CORS allow-list
        run: |
          az containerapp update -n todo-api -g "$RESOURCE_GROUP" \
            --set-env-vars "Cors__AllowedOrigins__0=https://${{ steps.web.outputs.fqdn }}"

      - name: Summary
        run: |
          {
            echo "## Deploy complete"
            echo "- Backend  (todo-api): https://${{ steps.api.outputs.fqdn }}"
            echo "- Frontend (todo-web): https://${{ steps.web.outputs.fqdn }}"
            echo "- Image tag: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
